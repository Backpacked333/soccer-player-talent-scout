[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "scoutroom-backend"
version = "0.1.0"
description = "Private, evidence-first youth soccer review workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.9.0",
  "uvicorn==0.38.0",
  "SQLAlchemy==2.0.44",
  "pydantic==2.12.4",
  "pydantic-settings==2.16.1",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.14.10", "mypy==1.19.1", "pip-audit==2.10.1"]
postgres = ["psycopg[binary]==3.2.9"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
required-version = ">=0.6.0"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Heavy research packages are deliberately absent from the ordinary install.
# Only their lazy imports are untyped; the adapter bodies are still checked.
[[tool.mypy.overrides]]
module = ["kloppy.*", "av", "numpy", "supervision", "torch", "rfdetr"]
ignore_missing_imports = true
